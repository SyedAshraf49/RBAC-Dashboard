services:
  # PostgreSQL Database
  - type: pserv
    name: rbac-dashboard-db
    env: python
    plan: free
    region: singapore
    
  # Web Service (Flask Backend + Frontend)
  - type: web
    name: rbac-dashboard
    env: python
    plan: free
    region: singapore
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: rbac-dashboard-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
